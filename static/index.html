<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>voice-cut-pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 24px;
    }
    .container { max-width: 880px; margin: 0 auto; }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #f8fafc;
    }
    .subtitle { font-size: 13px; color: #64748b; margin-top: 4px; margin-bottom: 32px; }

    /* Config block */
    .config {
      background: #161b27;
      border: 1px solid #1e2433;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .config-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .config-row:last-child { margin-bottom: 0; }
    .config-row label {
      flex-shrink: 0;
      font-size: 13px;
      color: #94a3b8;
      width: 86px;
    }
    .config-row input {
      flex: 1;
      background: #0f1117;
      border: 1px solid #1e2433;
      border-radius: 8px;
      padding: 8px 12px;
      color: #e2e8f0;
      font-size: 13px;
      font-family: "SF Mono", monospace;
    }
    .config-row input:focus { outline: none; border-color: #6366f1; }

    /* Step cards */
    .steps {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .step-card {
      background: #161b27;
      border: 1px solid #1e2433;
      border-radius: 12px;
      padding: 18px 20px;
      transition: border-color 0.15s;
    }
    .step-card.done    { border-color: #065f46; }
    .step-card.error   { border-color: #7f1d1d; }
    .step-card.running { border-color: #6366f1; }

    .step-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .step-num {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #1e2433;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step-card.done    .step-num { background: #065f46; color: #6ee7b7; }
    .step-card.error   .step-num { background: #7f1d1d; color: #fca5a5; }
    .step-card.running .step-num { background: #4f46e5; color: #fff; }

    .step-title {
      font-size: 15px;
      font-weight: 600;
      color: #e2e8f0;
      flex: 1;
    }
    .step-desc { font-size: 12px; color: #64748b; margin-top: 2px; }

    .step-paths {
      display: grid;
      grid-template-columns: 60px 1fr;
      gap: 6px 10px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .step-paths label { color: #475569; }
    .step-paths .path-val {
      color: #cbd5e1;
      font-family: "SF Mono", monospace;
      font-size: 11px;
      word-break: break-all;
    }

    .step-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .btn-run {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-run:hover:not(:disabled) { background: #6366f1; }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #334155;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .step-card.running .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step-stats {
      font-size: 12px;
      color: #94a3b8;
      flex: 1;
      text-align: right;
    }
    .stat-ok    { color: #6ee7b7; }
    .stat-error { color: #fca5a5; }

    .step-errors {
      margin-top: 10px;
      border-top: 1px solid #1e2433;
      padding-top: 10px;
    }
    .step-errors summary {
      cursor: pointer;
      font-size: 12px;
      color: #fca5a5;
      list-style: none;
    }
    .step-errors summary::before {
      content: "▶ ";
      font-size: 9px;
    }
    .step-errors[open] summary::before { content: "▼ "; }
    .step-errors ul {
      margin-top: 8px;
      padding-left: 16px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 11px;
      font-family: "SF Mono", monospace;
      color: #94a3b8;
    }
    .step-errors li { margin: 3px 0; word-break: break-all; }

    .global-error {
      display: none;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #fca5a5;
      margin-bottom: 16px;
    }
    .global-error.show { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>voice-cut-pipeline</h1>
    <p class="subtitle">满帮电话录音清洗流水线 · 7 步生成、验证并管理音色克隆效果（Step 3 含时长过滤）</p>

    <div class="global-error" id="globalError"></div>

    <div class="config">
      <div class="config-row">
        <label>工作目录</label>
<!--        <input id="workDir" placeholder="/tmp/vcp-test  (必须含 'temp')" />-->
        <input id="workDir" placeholder="/tmp/vcp-test  (必须含 'temp')" />
      </div>
      <div class="config-row">
        <label>源文件夹</label>
        <input id="srcDir" placeholder="/Users/.../20260111" />
      </div>
    </div>

    <div class="steps" id="steps"></div>
  </div>

  <script>
    const STEPS = [
      { n: 1, key: 'step1', title: "按货主 ID 分类",    desc: "解析文件名 → 拷贝到 temp1/{shipper_id}/" },
      { n: 2, key: 'step2', title: "提取货主声道",      desc: "根据声道字段输出单声道 WAV → temp2/" },
      { n: 3, key: 'step3', title: "切分 + 时长过滤",   desc: "按 0.3s 气口切分，丢弃 < 2s 短段 → temp3/" },
      { n: 4, key: 'step4', title: "音质筛选 + 排名",   desc: "9 条噪声规则过滤 → 评分排名 → rank1_… 保存到 temp4/" },
      { n: 5, key: 'step5', title: "ASR 内容过滤",     desc: "仅对 rank1 调自建 ASR → 过滤 <5 汉字/重复 → temp5/（含 .txt）" },
      { n: 6, key: 'step6', title: "两轮音色克隆验证",  desc: "R1 克隆→生成→选优→R2 克隆→生成→评估报告 → temp6/", hasApiKey: true },
      { n: 7, key: 'step7', title: "删除音色记录",      desc: "根据 voice_id 调用删除接口，不清理任何 temp 目录", hasApiKey: true, hasVoiceId: true, noPaths: true },
    ];

    const stepsEl = document.getElementById('steps');
    const workDirEl = document.getElementById('workDir');
    const srcDirEl = document.getElementById('srcDir');
    const globalError = document.getElementById('globalError');

    // 每个步骤的输入/输出目录（相对 workDir）
    function stepDirs(work, src) {
      return {
        step1: { input: src,             output: work + '/temp1' },
        step2: { input: work + '/temp1', output: work + '/temp2' },
        step3: { input: work + '/temp2', output: work + '/temp3' },
        step4: { input: work + '/temp3', output: work + '/temp4' },
        step5: { input: work + '/temp4', output: work + '/temp5' },
        step6: { input: work + '/temp5', output: work + '/temp6' },
      };
    }

    // 渲染步骤卡片
    STEPS.forEach(s => {
      const card = document.createElement('div');
      card.className = 'step-card';
      card.id = s.key;
      card.innerHTML = `
        <div class="step-head">
          <div class="step-num">${s.n}</div>
          <div style="flex:1">
            <div class="step-title">${s.title}</div>
            <div class="step-desc">${s.desc}</div>
          </div>
        </div>
        ${!s.noPaths ? `
        <div class="step-paths">
          <label>输入</label><span class="path-val" id="src_${s.key}">-</span>
          <label>输出</label><span class="path-val" id="dst_${s.key}">-</span>
        </div>` : ''}
        ${s.hasVoiceId ? `
        <div class="config-row" style="margin-bottom:12px">
          <label style="width:72px">Voice ID</label>
          <input id="voiceId_${s.key}" placeholder="manbang_..." style="flex:1" />
        </div>` : ''}
        ${s.hasApiKey ? `
        <div class="config-row" style="margin-bottom:12px">
          <label style="width:72px">API Key</label>
          <input id="apiKey_${s.key}" type="text" placeholder="VUILABS_API_KEY（必填）" style="flex:1" />
        </div>` : ''}
        <div class="step-actions">
          <button class="btn-run" id="btn_${s.key}" onclick="runStep('${s.key}')">运行</button>
          <div class="spinner"></div>
          <div class="step-stats" id="stats_${s.key}">待运行</div>
        </div>
      `;
      stepsEl.appendChild(card);
    });

    // 自动填充路径
    function syncPaths() {
      const work = workDirEl.value.trim();
      const src = srcDirEl.value.trim();
      const dirs = stepDirs(work, src);
      STEPS.forEach(s => {
        const srcEl = document.getElementById(`src_${s.key}`);
        const dstEl = document.getElementById(`dst_${s.key}`);
        if (srcEl) srcEl.textContent = dirs[s.key]?.input || '-';
        if (dstEl) dstEl.textContent = dirs[s.key]?.output || '-';
      });
    }
    workDirEl.addEventListener('input', syncPaths);
    srcDirEl.addEventListener('input', syncPaths);

    // 从 localStorage 恢复
    workDirEl.value = localStorage.getItem('vcp_work_dir') || '';
    srcDirEl.value  = localStorage.getItem('vcp_src_dir')  || '';
    syncPaths();
    workDirEl.addEventListener('change', () => localStorage.setItem('vcp_work_dir', workDirEl.value));
    srcDirEl.addEventListener('change',  () => localStorage.setItem('vcp_src_dir',  srcDirEl.value));

    function showError(msg) {
      globalError.textContent = msg;
      globalError.classList.add('show');
    }
    function hideError() { globalError.classList.remove('show'); }

    // 每个步骤重跑时需要清空的下游目录（用于 confirm 提示）
    const DOWNSTREAM_DIRS = {
      step1: ['temp1', 'temp2', 'temp3', 'temp4', 'temp5', 'temp6'],
      step2: ['temp2', 'temp3', 'temp4', 'temp5', 'temp6'],
      step3: ['temp3', 'temp4', 'temp5', 'temp6'],
      step4: ['temp4', 'temp5', 'temp6'],
      step5: ['temp5', 'temp6'],
      step6: ['temp6'],
      step7: [],
    };

    async function runStep(key) {
      hideError();
      const work = workDirEl.value.trim();
      const src = srcDirEl.value.trim();
      if (key !== 'step7' && !work) return showError('请先填写工作目录');
      if (key === 'step1' && !src) return showError('请先填写源文件夹');

      const dirs = stepDirs(work, src);
      const { input: inputPath, output: outputPath } = dirs[key] || {};
      const downstream = DOWNSTREAM_DIRS[key] || [];
      const stepMeta = STEPS.find(s => s.key === key);
      const apiKeyEl = document.getElementById(`apiKey_${key}`);
      const apiKey = apiKeyEl ? apiKeyEl.value.trim() : '';
      if (stepMeta?.hasApiKey && !apiKey) return showError('请填写 API Key');
      const voiceIdEl = document.getElementById(`voiceId_${key}`);
      const voiceId = voiceIdEl ? voiceIdEl.value.trim() : '';
      if (stepMeta?.hasVoiceId && !voiceId) return showError('请填写 Voice ID');

      const confirmText = key === 'step7'
        ? `确认删除音色 ${voiceId}？`
        : `运行 Step ${stepMeta.n} 将清空 ${downstream.join('、')}。继续？`;
      if (!confirm(confirmText)) {
        return;
      }

      const card = document.getElementById(key);
      const btn = document.getElementById(`btn_${key}`);
      const stats = document.getElementById(`stats_${key}`);
      card.className = 'step-card running';
      btn.disabled = true;
      stats.textContent = '运行中...';

      try {
        const resp = await fetch(`/run/${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(key === 'step7'
            ? { voice_id: voiceId, api_key: apiKey }
            : { src: inputPath, dst: outputPath, work_dir: work, api_key: apiKey || undefined }),
        });
        const raw = await resp.text();
        let data;
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (e) {
          throw new Error(raw || e.message);
        }

        if (!resp.ok) {
          card.className = 'step-card error';
          stats.innerHTML = `<span class="stat-error">${data.detail || '请求失败'}</span>`;
          return;
        }

        renderResult(key, data);
      } catch (e) {
        card.className = 'step-card error';
        stats.innerHTML = `<span class="stat-error">网络错误：${e.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    }

    function renderResult(key, data) {
      const card = document.getElementById(key);
      const stats = document.getElementById(`stats_${key}`);
      const cls = data.status === 'ok' ? 'done' : 'error';
      card.className = `step-card ${cls}`;

      const summary = `输入 ${data.input_count} → 输出 <span class="stat-ok">${data.output_count}</span>`
        + (data.skipped ? ` · 跳过 ${data.skipped}` : '')
        + (data.errors.length ? ` · <span class="stat-error">错误 ${data.errors.length}</span>` : '')
        + ` · ${data.elapsed_ms}ms`;
      stats.innerHTML = summary;

      // 移除旧的 errors 块
      const old = card.querySelector('.step-errors');
      if (old) old.remove();

      if (data.errors.length) {
        const errEl = document.createElement('details');
        errEl.className = 'step-errors';
        const label = (data.step >= 4) ? '过滤/错误详情' : '查看错误列表';
        errEl.innerHTML = `
          <summary>${label}（${data.errors.length}）</summary>
          <ul>${data.errors.map(e => `<li>${e.file}: ${e.reason}</li>`).join('')}</ul>
        `;
        card.appendChild(errEl);
      }
    }
  </script>
</body>
</html>
